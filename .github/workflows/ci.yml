name: MLOps CI Quality Gate Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-pipeline:
    name: Lint, Test and MLOps Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: make install

      - name: Code Quality Lint (flake8)
        run: make lint

      - name: Execute Model Training and Experiment Tracking
        run: make train

      - name: Run Test Suite and MLOps Quality Gates
        run: make test
